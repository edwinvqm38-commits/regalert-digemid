name: DIGEMID - OCR IA Normativa

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecucion: dry-run (solo lista candidatas), report (llama al modelo y arma un HTML con diferencias resaltadas, sin escribir en Supabase) o apply (guarda en Supabase)"
        required: true
        default: "report"
        type: choice
        options:
          - dry-run
          - report
          - apply
      filtro:
        description: "Que paginas revisar"
        required: true
        default: "todas-pendientes"
        type: choice
        options:
          - todas-pendientes
          - calidad-baja
          - tablas-pendientes
      limit:
        description: "Maximo de paginas a procesar"
        required: false
        default: "10"
        type: string
      document_key:
        description: "Procesar una sola norma (opcional)"
        required: false
        default: ""
        type: string
      provider:
        description: "Proveedor de vision OCR"
        required: true
        default: "openrouter"
        type: choice
        options:
          - openrouter
          - openai
      model:
        description: "Modelo vision OCR (opcional; usa variable por defecto si queda vacio)"
        required: false
        default: ""
        type: string
      quality_below:
        description: "Procesar paginas con calidad menor a este valor"
        required: false
        default: "0.85"
        type: string
      replace_text:
        description: "Reemplazar text_normalized para que /consulta use la transcripcion IA"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  openai-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_OCR_MODEL: ${{ vars.OPENAI_OCR_MODEL || 'gpt-5.6' }}
      OPENROUTER_OCR_MODEL: ${{ vars.OPENROUTER_OCR_MODEL || 'openrouter/auto' }}
      VISION_OCR_DETAIL: ${{ vars.VISION_OCR_DETAIL || 'original' }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar OCR IA
        shell: bash
        run: |
          set -euo pipefail
          CMD=(
            python scripts/ocr_normativa_openai_pages.py
            --limit "${{ inputs.limit }}"
            --quality-below "${{ inputs.quality_below }}"
            --provider "${{ inputs.provider }}"
            --filtro "${{ inputs.filtro }}"
          )

          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            CMD+=(--apply)
          fi

          if [[ "${{ inputs.mode }}" == "report" ]]; then
            CMD+=(--report-html reporte_diferencias.html)
          fi

          if [[ "${{ inputs.replace_text }}" == "true" ]]; then
            CMD+=(--replace-text)
          fi

          if [[ -n "${{ inputs.document_key }}" ]]; then
            CMD+=(--document-key "${{ inputs.document_key }}")
          fi
          if [[ -n "${{ inputs.model }}" ]]; then
            CMD+=(--model "${{ inputs.model }}")
          fi

          printf 'Ejecutando: %q ' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: Subir reporte de diferencias
        if: inputs.mode == 'report'
        uses: actions/upload-artifact@v4
        with:
          name: reporte-diferencias-ocr
          path: reporte_diferencias.html
          retention-days: 14
