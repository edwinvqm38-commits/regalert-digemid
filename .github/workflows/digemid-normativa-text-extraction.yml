name: DIGEMID - Normativa Text Extraction

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecucion"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      document_key:
        description: "Document key normativo a procesar"
        required: false
        default: "LEY-29459"
        type: string
      enable_ocr:
        description: "Usar OCR solo en páginas sin texto embebido suficiente"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ocr_max_pages:
        description: "Máximo de páginas OCR por corrida (1-100)"
        required: true
        default: "50"
        type: string
      start_page:
        description: "Primera página física elegible para OCR"
        required: true
        default: "1"
        type: string
      force:
        description: "Forzar actualizacion de paginas ya existentes"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  normativa-text-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: normativa-text-extraction-${{ inputs.document_key }}
      cancel-in-progress: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Tesseract OCR (español)
        if: inputs.enable_ocr == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar credenciales Google OAuth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/google"

          cat > "$RUNNER_TEMP/google/google_oauth_client.json" <<'EOF'
          ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          EOF

          cat > "$RUNNER_TEMP/google/google_oauth_token.json" <<'EOF'
          ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          EOF

      - name: Ejecutar extraccion de texto normativo
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_JSON_PATH: ${{ runner.temp }}/google/google_oauth_client.json
          GOOGLE_OAUTH_TOKEN_PATH: ${{ runner.temp }}/google/google_oauth_token.json
          OCR_MAX_PAGES: ${{ inputs.ocr_max_pages }}
          OCR_START_PAGE: ${{ inputs.start_page }}
        run: |
          set -euo pipefail
          if ! [[ "$OCR_MAX_PAGES" =~ ^[0-9]+$ ]] || (( OCR_MAX_PAGES < 1 || OCR_MAX_PAGES > 100 )); then
            echo "ocr_max_pages debe ser un entero entre 1 y 100" >&2
            exit 2
          fi
          if ! [[ "$OCR_START_PAGE" =~ ^[0-9]+$ ]] || (( OCR_START_PAGE < 1 )); then
            echo "start_page debe ser un entero mayor que cero" >&2
            exit 2
          fi
          CMD=(python scripts/extract_normativa_pdf_text_to_supabase.py --document-key "${{ inputs.document_key }}")

          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            CMD+=(--apply)
          else
            CMD+=(--dry-run)
          fi

          if [[ "${{ inputs.force }}" == "true" ]]; then
            CMD+=(--force)
          fi

          if [[ "${{ inputs.enable_ocr }}" == "true" ]]; then
            CMD+=(--ocr --ocr-lang spa --ocr-dpi 300 --start-page "$OCR_START_PAGE" --max-pages "$OCR_MAX_PAGES")
          fi

          printf 'Ejecutando: %q ' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normativa-text-extraction
          path: |
            reports/normativa_text_extraction_dry_run.md
            reports/normativa_text_extraction_result.md
            reports/normativa_text_extraction_result.json
          if-no-files-found: error
