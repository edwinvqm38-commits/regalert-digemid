name: DIGEMID - Detectar Derogaciones (IA)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de normas a analizar"
        required: false
        default: "20"
        type: string
      document_key:
        description: "Reanalizar SOLO esta norma (opcional)"
        required: false
        default: ""
        type: string

  # PAUSADO A PROPOSITO (auditoría · ver
  # docs/AUDITORIA_RELACIONES_NORMATIVAS.md y
  # docs/IDENTIDAD_NORMATIVA_H05_H06_H07.md).
  #
  # H-05/H-06/H-07 YA ESTAN CERRADOS: la identidad de la norma afectada se
  # resuelve con la capa canonica (scripts/identidad_normativa.py), ante varias
  # candidatas NO se vincula, y el reanalisis es idempotente.
  #
  # Sigue pausado por lo que falta: los stubs duplican la identidad de normas
  # reales (H-08) y el bot todavia crea stubs sin usar esta capa. Reactivar el
  # cron ahora repoblaria el corpus enlazando contra stubs.
  #
  # Precision antes que volumen: se reactiva al cerrar H-08 y tras un backfill
  # controlado por lotes. Mientras tanto el analisis sigue disponible a demanda
  # con workflow_dispatch (incluido --force).
  #
  #   - cron: "30 * * * *"

concurrency:
  group: digemid-normativa-derogaciones
  cancel-in-progress: false

jobs:
  detectar-derogaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detectar derogaciones con IA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            LIMIT="20"
          else
            LIMIT="${{ inputs.limit }}"
          fi

          CMD=(python scripts/detectar_derogaciones_normativa.py --limit "$LIMIT")
          if [[ -n "${{ inputs.document_key }}" ]]; then
            CMD+=(--document-key "${{ inputs.document_key }}")
          fi

          printf 'Ejecutando: %q ' "${CMD[@]}"; printf '\n'
          "${CMD[@]}"
