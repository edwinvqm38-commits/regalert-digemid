name: F-02 - Auditoria de custodia y piloto de verificacion (SOLO LECTURA)

# Manual a proposito: NO tiene schedule. Esta auditoria no escribe nada en
# Supabase -solo SELECT y descargas de Storage- y publica sus resultados como
# artifact para revisarlos sin tocar produccion.
on:
  workflow_dispatch:
    inputs:
      tarea:
        description: "Que ejecutar"
        required: true
        default: "inventario"
        type: choice
        options:
          - inventario          # SHA-256 + page_count + completitud de todo el corpus
          - piloto              # 50 paginas de alto riesgo, 3 motores
          - identidad_documental  # ¿cada norma esta asociada al PDF correcto? (F-03)
          - revision_visual     # HTML con imagen del PDF + transcripcion editable
          - ambas               # inventario + piloto
      limite:
        description: "Maximo de normas (inventario) o paginas (piloto)"
        required: false
        default: "50"
        type: string
      document_key:
        description: "Solo esta norma (opcional, para el piloto)"
        required: false
        default: ""
        type: string
      render_encabezado:
        description: >-
          F-03: leer el encabezado del RENDER cuando la capa de texto no basta
          (primera pagina sin texto, o texto sin ningun encabezado propio). No
          es el piloto de OCR. Si se desactiva, esos documentos salen
          AUDITORIA_INCOMPLETA en vez de concluir nada.
        required: false
        default: true
        type: boolean

concurrency:
  group: f02-auditoria-custodia
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Tesseract OCR (español)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que la auditoria no escribe
        shell: bash
        run: |
          set -euo pipefail
          # Red de seguridad: estos scripts solo pueden leer. Si alguien agrega
          # una escritura, el workflow falla ANTES de ejecutarla.
          #
          # Se buscan escrituras contra Supabase, no cualquier metodo llamado
          # insert: sys.path.insert() es legitimo y no toca la base.
          PATRON='(table\([^)]*\)|from_\([^)]*\))\s*\.\s*(insert|update|upsert|delete)\b'
          PATRON_STORAGE='storage\.from_\([^)]*\)\.(upload|remove|move|copy)'
          if grep -nEH "$PATRON|$PATRON_STORAGE" \
               scripts/auditar_custodia_documental.py \
               scripts/piloto_verificacion_paginas.py \
               scripts/generar_revision_visual.py \
               scripts/auditar_identidad_documental.py; then
            echo "ERROR: se detecto una operacion de escritura en un script de auditoria."
            exit 1
          fi
          echo "Confirmado: los scripts de auditoria solo leen."

      - name: Inventario de cadena de custodia
        if: ${{ inputs.tarea == 'inventario' || inputs.tarea == 'ambas' }}
        run: |
          python scripts/auditar_custodia_documental.py \
            --out-dir reportes --limite "${{ inputs.limite }}"

      - name: Piloto de verificacion de paginas de alto riesgo
        if: ${{ inputs.tarea == 'piloto' || inputs.tarea == 'ambas' }}
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python scripts/piloto_verificacion_paginas.py
               --limite "${{ inputs.limite }}" --out-dir reportes)
          if [[ -n "${{ inputs.document_key }}" ]]; then
            CMD+=(--document-key "${{ inputs.document_key }}")
          fi
          "${CMD[@]}"

      - name: Auditoria de identidad documental (F-03)
        if: ${{ inputs.tarea == 'identidad_documental' }}
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python scripts/auditar_identidad_documental.py --out-dir reportes)
          if [[ "${{ inputs.render_encabezado }}" == "true" ]]; then
            CMD+=(--con-ocr)
          fi
          if [[ -n "${{ inputs.document_key }}" ]]; then
            CMD+=(--solo "${{ inputs.document_key }}")
          fi
          if [[ -n "${{ inputs.limite }}" && "${{ inputs.limite }}" != "0" ]]; then
            CMD+=(--limite "${{ inputs.limite }}")
          fi
          "${CMD[@]}"

      - name: Reporte visual para revision humana
        if: ${{ inputs.tarea == 'revision_visual' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.document_key }}" ]]; then
            echo "revision_visual necesita document_key (una o varias, separadas por coma)"
            exit 1
          fi
          python scripts/generar_revision_visual.py \
            --document-keys "${{ inputs.document_key }}" \
            --limite "${{ inputs.limite }}" \
            --out reportes/REVISION_VISUAL.html

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f02-auditoria-${{ github.run_number }}
          path: reportes/
          if-no-files-found: warn
          retention-days: 30
