name: DIGEMID - Detectar Derogaciones (IA)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de normas a analizar"
        required: false
        default: "20"
        type: string
      document_key:
        description: "Reanalizar SOLO esta norma (opcional)"
        required: false
        default: ""
        type: string

  # PAUSADO A PROPOSITO (auditoría, hallazgo H-06 · ver
  # docs/AUDITORIA_RELACIONES_NORMATIVAS.md).
  #
  # Al subir el analizador a v2, las 292 normas del corpus quedaron en v1 y se
  # reencolan automaticamente. Pero la resolucion de identidad de la norma
  # afectada todavia compara solo numero+año -sin tipo ni sufijo de sector-, y
  # con año nulo (frecuente en leyes: "Ley 29459") falla y crea un stub. Dejar
  # correr el backfill ahora produciria cientos de relaciones apuntando a la
  # norma equivocada o a stubs duplicados, justo el problema que ya obligo a
  # reconciliar LEY-29459 a mano.
  #
  # Precision antes que volumen: se reactiva al cerrar H-05/H-06 y tras un
  # backfill controlado por lotes. Mientras tanto el analisis sigue disponible
  # a demanda con workflow_dispatch (incluido --force).
  #
  # schedule:
  #   - cron: "30 * * * *"

concurrency:
  group: digemid-normativa-derogaciones
  cancel-in-progress: false

jobs:
  detectar-derogaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detectar derogaciones con IA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            LIMIT="20"
          else
            LIMIT="${{ inputs.limit }}"
          fi

          CMD=(python scripts/detectar_derogaciones_normativa.py --limit "$LIMIT")
          if [[ -n "${{ inputs.document_key }}" ]]; then
            CMD+=(--document-key "${{ inputs.document_key }}")
          fi

          printf 'Ejecutando: %q ' "${CMD[@]}"; printf '\n'
          "${CMD[@]}"
