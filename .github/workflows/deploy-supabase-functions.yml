name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
      - ".github/workflows/set-telegram-webhook.yml"

jobs:
  deploy-whatsapp:
    name: Deploy WhatsApp independently
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar credenciales de Supabase
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Faltan credenciales de Supabase."
            exit 1
          fi

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar función whatsapp-bot
        run: supabase functions deploy whatsapp-bot --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

  prepare-telegram:
    name: Sync secret, configure and verify Telegram
    uses: ./.github/workflows/set-telegram-webhook.yml
    secrets: inherit

  deploy-telegram:
    name: Deploy authenticated Telegram function
    needs: prepare-telegram
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar función telegram-bot
        run: supabase functions deploy telegram-bot --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
